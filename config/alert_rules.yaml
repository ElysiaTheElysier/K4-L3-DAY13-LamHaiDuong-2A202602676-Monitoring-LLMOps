alerts:
  - name: HighLatencyP95
    severity: warning
    condition: p95(latency_ms) > 3000ms
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202602676
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: error_rate > 2% OR retrieval_success_rate < 90%
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202602676
    runbook: docs/alerts.md#alert-2
  - name: HighCostSpike
    severity: warning
    condition: total_cost_usd > 2.5 OR sum(tokens_out) > 50000
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202602676
    runbook: docs/alerts.md#alert-3
